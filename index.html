<!doctype html>
<html>
  <head>
    <title>Simple CAPTCHA</title>
    <style>
      body {
        overflow: hidden;
      }
      .box {
        display: flex;
        justify-content: space-between;
        width: 250px;
        height: 50px;
        border: 2px black solid;
        align-items: center;
        border-radius: 10px;
        gap: 0px;
        padding: 10px;
        position: absolute;
        left: 50vw;
        top: 50vh;
      }
      .box * {
        margin-left: 10px;
        margin-right: 10px;
      }
      input {
        width: 25px;
        height: 25px;
      }
    </style>
  </head>
  <body>
    <div id="title" style="justify-items: center">
      <h1><strong>click the captcha to proceed</strong></h1>
    </div>
    <div id="CAPTCHA" class="box">
      <input type="checkbox" id="verify" />
      <p style="margin-left: -5px; margin-right: 5px">I'm not a robot</p>
      <img src="imgs/OIP-Photoroom.png" height="75px" width="75px" />
    </div>
    <script>
      const CAPTCHA = document.getElementById("CAPTCHA");
      const widthe = CAPTCHA.offsetWidth;
      const heighte = CAPTCHA.offsetHeight;
      const height = window.innerHeight;
      const width = window.innerWidth;
      const cb = document.getElementById("verify");
      function distance(x1, y1, x2, y2) {
        return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
      }
      function rand(max, min) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }
      function rand_pos() {
        return {
          x: rand(width - widthe, widthe) + "px",
          y: rand(height - heighte, heighte) + "px",
        };
      }
      document.addEventListener("mousemove", (event) => {
        const rect = CAPTCHA.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dist = distance(event.clientX, event.clientY, centerX, centerY);

        if (dist < 114) {
          const pos = rand_pos();
          console.log("too close");
          CAPTCHA.style.left = pos.x;
          CAPTCHA.style.top = pos.y;
        }
      });
      cb.addEventListener("change", () => {
        const signal = cb.checked;

        if (signal) {
          history.pushState(null, "", location.href);
          window.addEventListener("popstate", () => {
            window.location.replace(
              "https://crescent.hackclub.com/projects/291",
            );
          });
      });
    </script>
  </body>
</html>
